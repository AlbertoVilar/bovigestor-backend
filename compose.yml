services:
  postgres:
    image: postgres:17
    container_name: bovigestor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bovigestor
      POSTGRES_USER: bovigestor
      POSTGRES_PASSWORD: ${BOVIGESTOR_DB_PASSWORD:?Database password is required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - bovigestor_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bovigestor -d bovigestor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bovigestor_pgdata:
